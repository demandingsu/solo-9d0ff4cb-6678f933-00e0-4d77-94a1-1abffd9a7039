upstream blind_label_backend {
    server app1:8000;
    server app2:8000;
}

server {
    listen 80;
    client_max_body_size 8m;

    location / {
        proxy_pass http://blind_label_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
