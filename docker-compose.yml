# 两个应用进程（app1/app2）挂载同一个卷，共享 /data/annotate.db；
# nginx 轮询转发，浏览器刷新即可看到页脚进程名在 app1/app2 间切换。
#
# 若卷里是旧版数据库（只有 record_no），两个进程启动时都会执行升级：
# 升级在一个 BEGIN IMMEDIATE 事务内完成，串行生效且只生效一次；
# 失败整体回滚，容器会按 restart 策略重试。
services:
  app1:
    build: .
    environment:
      INSTANCE_NAME: app1
      DB_PATH: /data/annotate.db
      CLAIM_TTL_SECONDS: "60"   # 演示超时可调小，如 "10"
    volumes:
      - dbdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  app2:
    build: .
    environment:
      INSTANCE_NAME: app2
      DB_PATH: /data/annotate.db
      CLAIM_TTL_SECONDS: "60"
    volumes:
      - dbdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:   # 命名卷：容器重启/重建后标签与领取期限仍在
